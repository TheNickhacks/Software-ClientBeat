{% extends 'base.html' %}
{% block title %}{{ titulo }} — Client Beat{% endblock %}
{% block content %}
<section class="pt-32 pb-20">
  <div class="container mx-auto px-6 max-w-4xl">
    <h1 class="text-4xl font-bold gradient-text mb-4">{{ titulo }}</h1>
    <p class="text-gray-500 mb-8">Última actualización: {{ fecha_actualizacion }}</p>
    <div class="glass-effect p-8 rounded-2xl prose prose-slate max-w-none">
      {{ contenido|linebreaks }}
    </div>
  </div>
</section>
{% endblock %}
