<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Código QR inválido - Client Beat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-orange-50 flex items-center justify-center p-4">
  <div class="w-full max-w-xl text-center">
    <div class="bg-white/90 rounded-3xl shadow-xl p-10 border border-white">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-rose-400 to-orange-500 shadow-lg mb-5">
        <i class="fa fa-qrcode text-white text-4xl"></i>
      </div>
      <h1 class="text-3xl font-black text-slate-900 mb-3">Código QR no válido</h1>
      <p class="text-slate-700 mb-6">Este código QR no corresponde a un local activo de Client Beat, o la plantilla de encuesta aún no está configurada.</p>
      <p class="text-sm text-slate-500 mb-6">Si crees que es un error, contacta al local o a soporte@clientbeat.cl.</p>
      <a href="/" class="inline-block bg-gradient-to-r from-rose-600 to-orange-600 text-white font-bold px-7 py-3 rounded-2xl shadow-lg transition hover:brightness-110">
        <i class="fa fa-home mr-2"></i>Ir al inicio
      </a>
    </div>
  </div>
</body>
</html>
